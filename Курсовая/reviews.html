<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Save game 2048 and play with your friends</title>
    <link rel="stylesheet" href="reviews.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&family=Yanone+Kaffeesatz:wght@200..700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <nav class="header-nav">
            <ul class="header-ul">
                <li class="logo-li">
                  <img src="https://avatars.mds.yandex.net/get-shedevrum/14655635/img_005f3790cebf11efbc0a4641c560cfb3/orig" alt="logo" class="card-img">
                </li>
                <li class="title-li amatic-sc-regular">LogicLab</li>
            </ul>
          </nav>
      </header>
      <section class="add-review-section">
        <form id="review-form">
          <h2 class="amatic-sc-regular">Оставьте свой отзыв</h2>
          <div class="form-group">
              <label for="userName"></label>
              <input type="text" id="userName" name="userName" placeholder="Имя:" required>
          </div>
          <div class="form-group">
            <input type="text" id="userName" name="userName" placeholder="Почта:" required>
        </div>
          <div class="form-group">
            <div class="star-rating">
                <input type="radio" id="star1" name="userRating" value="1">
                <label for="star1" title="1 star">&#9733;</label>
        
                <input type="radio" id="star2" name="userRating" value="2">
                <label for="star2" title="2 stars">&#9733;</label>
        
                <input type="radio" id="star3" name="userRating" value="3">
                <label for="star3" title="3 stars">&#9733;</label>
        
                <input type="radio" id="star4" name="userRating" value="4">
                <label for="star4" title="4 stars">&#9733;</label>
        
                <input type="radio" id="star5" name="userRating" value="5">
                <label for="star5" title="5 stars">&#9733;</label>
            </div>
        </div>

           <div class="form-group">
             <textarea id="reviewText" name="reviewText" rows="4" placeholder="Твой отзыв:" required></textarea>
          </div>
          <div class="form-actions">
               <button type="submit" class="submit-button amatic-sc-regular">Отправить</button>
          </div>
        </form>
    </section>
</body>
</html>
